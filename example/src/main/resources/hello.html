<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        main {
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
            gap: 20px;

            padding: 50px;
            width: 100vw;
            height: 100vh;
        }

        button {
            border: 1px solid #ccc;
            background: none;
            color: #222;
            cursor: pointer;
            padding: 10px 40px;
        }

        button:hover {
            border: 1px solid #222;
            background: #ccc;
        }

        button:focus {
            outline: 1px solid #0c97e0;
        }
    </style>
</head>
<body>
<main>
    <h1>Hello World!</h1>
    <button id="count">Count: 0</button>
</main>
<script>
    let count = 0;

    const button = document.getElementById("count");
    button.addEventListener("click", () => {
        button.innerText = `Count: ${++count}`;
    });
</script>
</body>
</html>
