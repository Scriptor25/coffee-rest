name = "coffee-rest"

[artifact]
group = "dev.scriptor"
name = "coffee-rest-parent"
version = "1.0.0"

[modules]
include = [
    "example",
    "reflect",
    "server",
    "server-jvm",
    "server-ui",
]

[repositories]
maven = ["https://repo1.maven.org/maven2/"]

[dependencies]
maven = [
    "org.jetbrains.kotlin:kotlin-stdlib:2.4.20",
    "org.jetbrains.kotlin:kotlin-reflect:2.4.20",
]
